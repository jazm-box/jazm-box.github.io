<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyBox</title>
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/mybox-192.png">
<link rel="apple-touch-icon" href="icons/mybox-180.png">
<style>
:root{--bg:#F3F4F8;--surface:#FFFFFF;--sunk:#ECEEF3;--ink:#161B26;--muted:#5B6376;--line:#E0E3EA;--accent:#34406B;--accent-ink:#FFFFFF;--accent-soft:#E3E7F3;
  --crit:#B42318;--crit-soft:#FDE8E6;--warn:#9A5B00;--warn-soft:#FFF0D9;--ok:#1E7F4F;--c-smart:#2456E0;--c-gesund:#8C2F45;--c-beleg:#0E6A5B;--shadow:0 1px 2px rgba(20,24,38,.06),0 4px 14px rgba(20,24,38,.05);
  color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#10131A;--surface:#1A1E28;--sunk:#141821;--ink:#EDEFF4;--muted:#A0A7B8;--line:#2A303D;--accent:#AFBAEA;--accent-ink:#151926;--accent-soft:#252C44;
  --crit:#FF8A80;--crit-soft:#3B1F1E;--warn:#F2B35B;--warn-soft:#382B15;--ok:#6FD39C;--c-smart:#8DB4FF;--c-gesund:#E8A0AE;--c-beleg:#5CC8B1;--shadow:none;color-scheme:dark}}
/* ds:start */
:root{--ds-ink:var(--ink);--ds-muted:var(--muted);--ds-line:var(--line);--ds-surface:var(--surface);--ds-sunk:var(--sunk);--ds-accent:var(--accent);--ds-accent-ink:var(--accent-ink);--ds-soft:var(--accent-soft);--ds-crit:var(--crit);--ds-crit-soft:var(--crit-soft);--ds-warn-soft:var(--warn-soft);--ds-ok:var(--ok);--ds-warn:var(--warn)}
/* ===== Gemeinsamer Baustein „Daten & Sicherheit“ – identisch in MySmartBox, MyGesundBox, MyBelegBox =====
   Nur die Farbzuordnung (--ds-*) oben unterscheidet sich je App. */
.ds-lbl{display:block;font-size:12px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ds-muted);margin:14px 0 8px}
.ds-lbl.sep{border-top:1px solid var(--ds-line);padding-top:14px;margin-top:18px}
.ds-hint{display:block;font-size:14px;line-height:1.45;color:var(--ds-muted);font-weight:400;margin:0 0 10px;max-width:none}
.ds-hint b{color:var(--ds-ink);font-weight:700}
.ds-stat{font-weight:400;display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.4;color:var(--ds-ink);background:var(--ds-sunk);border-radius:10px;padding:9px 12px;margin:0 0 10px}
.ds-acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.ds-btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--ds-line);background:var(--ds-surface);color:var(--ds-ink);font-family:inherit;font-size:15px;font-weight:600;line-height:1.1;cursor:pointer;white-space:nowrap;text-align:center}
.ds-btn:focus-visible{outline:2px solid var(--ds-accent);outline-offset:2px}
.ds-btn.pri{background:var(--ds-accent);border-color:var(--ds-accent);color:var(--ds-accent-ink)}
.ds-btn.dng{background:transparent;border-color:var(--ds-crit);color:var(--ds-crit)}
.ds-btn.dng.sure{background:var(--ds-crit);color:var(--ds-surface)}
.ds-btn[disabled],.ds-btn[aria-disabled="true"]{opacity:.55;pointer-events:none}
.ds-btn input[type=file]{display:none}
.ds-box{font-weight:400!important;border-radius:12px;padding:12px;margin:0 0 10px;font-size:14px;line-height:1.45;color:var(--ds-ink);background:var(--ds-sunk);overflow-wrap:anywhere}
.ds-box.crit{background:var(--ds-crit-soft)} .ds-box.warn{background:var(--ds-warn-soft)}
.ds-box .ds-acts{margin:10px 0 0}
.ds-box a{color:var(--ds-accent);font-weight:700}
.ds-box .ds-btn{min-height:36px;padding:0 12px;font-size:14px}
.ds-check{font-weight:400;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ds-ink);margin:0 0 10px}
.ds-end{height:4px}
.ds-ver{text-align:center;color:var(--ds-muted);font-size:12px;line-height:1.5;margin:14px 0 4px}
/* Akkordeon-Kopf im Blatt: gleiche Maße überall */
.ds-sheet .ds-acc-ai{width:36px;height:36px;flex:none;border-radius:10px;background:var(--ds-soft);color:var(--ds-accent);display:grid;place-items:center}
.ds-sheet .ds-acc-ai svg{width:19px;height:19px}
/* Fenster (GitHub einrichten, Passwort ändern) */
.ds-dlg-intro{font-size:14px;line-height:1.45;color:var(--ds-muted);margin:0 0 12px}
.ds-dlg-intro b{color:var(--ds-ink)}
.ds-err{font-size:14px;line-height:1.4;color:var(--ds-crit);margin:0 0 10px}
/* Hinweis „Neue Version“ oben */
.ds-updbar{position:fixed;z-index:120;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 6px 8px 16px;border-radius:14px;background:var(--ds-surface);color:var(--ds-ink);border:1px solid var(--ds-line);box-shadow:0 8px 24px rgba(0,0,0,.16);font-size:14px;font-weight:600;line-height:1.35;transform:none}
.ds-updbar span{flex:1;min-width:0}
.ds-updbar .ds-btn{min-height:36px;padding:0 12px;font-size:14px}
.ds-x{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;flex:none;display:grid;place-items:center;color:var(--ds-muted);border-radius:8px;font-size:16px}
/* Untertitel der Bereiche nie abschneiden, sondern umbrechen */
.ds-sheet-sub-wrap{}
.acc .at small,.accrow .at small,#bxsbody .acchd .at small{white-space:normal!important;overflow:visible!important;text-overflow:clip!important}
/* Erinnerung an die Datensicherung oben in der Übersicht */
.ds-remind{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin:0 0 14px;border-radius:16px;background:var(--ds-warn-soft);color:var(--ds-ink);cursor:pointer;text-align:left;font-family:inherit}
.ds-remind.crit{background:var(--ds-crit-soft)}
.ds-remind:focus-visible{outline:2px solid var(--ds-accent);outline-offset:2px}
.ds-remind-i{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--ds-surface);color:var(--ds-warn)}
.ds-remind.crit .ds-remind-i{color:var(--ds-crit)}
.ds-remind-i svg{width:20px;height:20px}
.ds-remind-t{flex:1;min-width:0;display:grid;gap:2px}
.ds-remind-t b{font-size:15px;font-weight:700;line-height:1.3}
.ds-remind-t small{font-size:13px;line-height:1.4;color:var(--ds-muted)}
.ds-remind-go{flex:none;font-size:14px;font-weight:700;color:var(--ds-surface);background:var(--ds-warn);border-radius:10px;padding:8px 12px}
.ds-remind.crit .ds-remind-go{background:var(--ds-crit)}
/* Suche als Blatt von unten – gleich in allen Apps */
.ds-srch{display:block;margin:0}
.ds-srch input{width:100%;box-sizing:border-box;margin:0;padding:12px 14px;border:1px solid var(--ds-line);border-radius:12px;background:var(--ds-sunk);color:var(--ds-ink);font:inherit;font-size:17px}
.ds-qres{display:grid;gap:10px;margin-top:12px}
.ds-qres .ds-lbl{margin:6px 0 0}
.ds-qhint{font-size:14px;line-height:1.45;color:var(--ds-muted);padding:8px 2px;margin:0}
.ds-qlist{display:flex;flex-direction:column;background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:14px;overflow:hidden}
.ds-qrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:12px 14px;cursor:pointer;color:var(--ds-ink);font-family:inherit;text-align:left}
.ds-qrow+.ds-qrow{border-top:1px solid var(--ds-line)}
.ds-qrow:focus-visible{outline:2px solid var(--ds-accent);outline-offset:-2px}
.ds-qrow .ds-qi{width:40px;height:40px;border-radius:10px;background:var(--ds-soft);color:var(--ds-accent);display:grid;place-items:center}
.ds-qrow .ds-qi svg{width:20px;height:20px}
.ds-qrow .ds-qt{min-width:0;display:grid;gap:2px}
.ds-qrow .ds-qt b{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.ds-qrow .ds-qt small{font-size:13px;color:var(--ds-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-srch .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Darstellung: Umschalter Automatisch / Hell / Dunkel */
.ds-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--ds-sunk)}
.ds-seg button{all:unset;box-sizing:border-box;text-align:center;padding:9px 6px;border-radius:9px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ds-muted);cursor:pointer}
.ds-seg button[aria-checked="true"]{background:var(--ds-surface);color:var(--ds-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ds-seg button:focus-visible{outline:2px solid var(--ds-accent)}
/* Feier-Effekt mit Konfetti */
.ds-yay{position:fixed;inset:0;z-index:140;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.ds-yay-card{position:relative;background:var(--ds-surface);color:var(--ds-ink);border-radius:24px;padding:22px 28px 16px;display:grid;justify-items:center;gap:8px;min-width:150px;box-shadow:0 18px 50px rgba(0,0,0,.28);animation:dsYayIn .45s cubic-bezier(.3,1.35,.5,1) both,dsYayOut .28s ease-in 1.2s forwards}
.ds-yay svg{width:64px;height:64px}
.ds-yay .yc{fill:none;stroke:var(--ds-ok);stroke-width:3;stroke-dasharray:145;stroke-dashoffset:145;animation:dsInk .45s ease-out .08s forwards}
.ds-yay .yk{fill:none;stroke:var(--ds-ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:34;stroke-dashoffset:34;animation:dsInk .28s ease-out .42s forwards}
.ds-yay b{font-size:15px;font-weight:700}
.ds-yay i{position:absolute;left:50%;top:54px;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--c);opacity:0;animation:dsSpark .65s ease-out .5s}
.ds-yay em{position:absolute;top:-16px;left:var(--x);width:8px;height:13px;border-radius:2px;background:var(--c);transform:scale(var(--s));animation:dsFall 2.2s cubic-bezier(.25,.6,.5,1) var(--d) forwards;opacity:0}
@keyframes dsInk{to{stroke-dashoffset:0}}
@keyframes dsSpark{0%{opacity:1;transform:rotate(var(--a)) translateY(-30px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-64px) scale(.3)}}
@keyframes dsYayIn{from{opacity:0;transform:scale(.6)}}
@keyframes dsYayOut{to{opacity:0;transform:scale(.92)}}
@keyframes dsFall{0%{opacity:1;transform:translateY(0) rotate(0) scale(var(--s))}85%{opacity:1}100%{opacity:0;transform:translateY(105vh) rotate(var(--r)) scale(var(--s))}}
/* Entsperr-Animation */
.ds-unl{position:fixed;z-index:130;width:0;height:0;pointer-events:none}
.ds-unl span{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.ds-unl-light .glow{width:72px;height:72px;background:radial-gradient(circle,rgba(255,214,90,.95) 0%,rgba(255,196,60,.45) 45%,rgba(255,196,60,0) 72%);animation:dsGlow .7s ease-out forwards}
.ds-unl-light .ray{width:72px;height:72px;background:conic-gradient(from 0deg,rgba(255,206,84,.55) 0 8deg,transparent 8deg 30deg,rgba(255,206,84,.55) 30deg 38deg,transparent 38deg 60deg,rgba(255,206,84,.55) 60deg 68deg,transparent 68deg 90deg);
  -webkit-mask:radial-gradient(circle,transparent 42%,#000 44%,#000 70%,transparent 72%);mask:radial-gradient(circle,transparent 42%,#000 44%,#000 70%,transparent 72%);animation:dsRays .7s ease-out forwards}
.ds-unl-light-ico{animation:dsLit .68s ease-out forwards}
@keyframes dsGlow{0%{width:40px;height:40px;opacity:0}40%{opacity:1}100%{width:260px;height:260px;opacity:.9}}
@keyframes dsRays{0%{width:60px;height:60px;opacity:0;transform:translate(-50%,-50%) rotate(-20deg)}50%{opacity:1}100%{width:230px;height:230px;opacity:.85;transform:translate(-50%,-50%) rotate(15deg)}}
@keyframes dsLit{0%{filter:none}35%{filter:brightness(1.6) saturate(1.2) drop-shadow(0 0 14px rgba(255,205,80,.95))}100%{filter:brightness(1.25) drop-shadow(0 0 22px rgba(255,205,80,.9));transform:scale(1.06)}}
.ds-unl-heart .ring{width:72px;height:72px;border:3px solid var(--ds-accent);opacity:0;animation:dsRing .75s ease-out forwards}
.ds-unl-heart .r2{animation-delay:.28s}
.ds-unl-heart-ico{animation:dsBeat .76s ease-in-out forwards}
@keyframes dsRing{0%{width:72px;height:72px;opacity:.8}100%{width:220px;height:220px;opacity:0}}
@keyframes dsBeat{0%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(.98)}42%{transform:scale(1.13)}70%{transform:scale(1)}100%{transform:scale(1.04)}}
/* Sicherungs-Status: Punkt am Schloss */
.ds-lockbtn{position:relative}
.ds-lockbtn[data-bk]:not([data-bk=""])::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px var(--ds-surface);background:var(--ds-ok)}
.ds-lockbtn[data-bk="warn"]:not([data-bk=""])::after{background:var(--ds-warn);animation:dsDot 2.4s ease-in-out infinite}
.ds-lockbtn[data-bk="crit"]:not([data-bk=""])::after{background:var(--ds-crit);animation:dsDot 1.6s ease-in-out infinite}
@keyframes dsDot{50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.ds-lockbtn::after{animation:none!important}}
/* Haken beim Speichern */
.ds-saved{background:var(--ds-ok)!important;border-color:var(--ds-ok)!important;color:#fff!important;display:inline-flex!important;align-items:center;justify-content:center;gap:6px}
.ds-saved .tk{stroke-dasharray:24;stroke-dashoffset:24;animation:dsInk .3s ease-out forwards}
/* Wechsel zwischen den Boxen */
.ds-boxes{display:flex;flex-direction:column;background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:14px;overflow:hidden;margin:0 0 6px}
.ds-boxlink{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;color:var(--ds-ink);text-decoration:none}
.ds-boxlink+.ds-boxlink{border-top:1px solid var(--ds-line)}
.ds-boxlink .ds-qt{display:grid;gap:2px;min-width:0}
.ds-boxlink .ds-qt b{font-size:15px;font-weight:700}
.ds-boxlink .ds-qt small{font-size:13px;color:var(--ds-muted)}
.ds-boxlink .chev{width:20px;height:20px;color:var(--ds-muted)}
.ds-boxico{width:36px;height:36px;border-radius:10px;display:block}

/* ds:end */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
/* Sperrbildschirm */
#lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px 16px;background:var(--bg);overflow:auto}
.lockbox{width:100%;max-width:380px;display:grid;gap:12px;text-align:center}
.lockbox img{width:84px;height:84px;margin:0 auto 4px;border-radius:20px}
.lockbox h1{margin:0;font-size:28px;letter-spacing:-.01em}
.lockbox p{margin:0;color:var(--muted);font-size:15px}
.lockbox input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:17px}
.lockbox input:focus{outline:2px solid var(--accent);outline-offset:1px}
.lerr{color:var(--crit);font-size:14px;min-height:1.2em;margin:0}
.bigbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;width:100%}
.bigbtn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.bigbtn[disabled]{opacity:.6;pointer-events:none}
.bigbtn svg{width:22px;height:22px}
.lockhint{font-size:13px!important;line-height:1.5}
.lver{font-size:12px!important;margin-top:6px!important}
.areadots{display:flex;justify-content:center;gap:10px;margin:2px 0 6px}
.areadots img{width:26px;height:26px;border-radius:7px;opacity:.9;margin:0}
/* Kopf */
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hd img{width:36px;height:36px;border-radius:10px}
.hd h1{margin:0;font-size:22px;letter-spacing:-.01em;flex:1;min-width:0}
.icobtn{all:unset;position:relative;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.icobtn svg{width:21px;height:21px}
.icobtn:focus-visible,.card:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.hello{font-size:15px;color:var(--muted);margin:4px 2px 12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sec small{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600}
/* Bereiche */
.areas{display:grid;gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;width:100%}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ac)}
.card img{width:48px;height:48px;border-radius:13px}
.card .ct{min-width:0;display:grid;gap:2px}
.card .cn{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ac)}
.card .cm{font-size:18px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.card .cs{font-size:14px;color:var(--muted)}
.card .cf{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.card .cf span{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.chev{width:20px;height:20px;color:var(--muted)}
.card.wait .cm{color:var(--muted);font-weight:600}
.card.need .cm{color:var(--crit)}
/* Zeitleiste */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;width:100%}
.row+.row{border-top:1px solid var(--line)}
.dt{width:48px;height:52px;border-radius:12px;display:grid;place-content:center;text-align:center;background:color-mix(in srgb,var(--ac) 13%,var(--surface));color:var(--ac);line-height:1.05}
.dt b{font-size:19px}
.dt small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rt{min-width:0;display:grid;gap:1px}
.rt b{font-size:15.5px;font-weight:700;overflow-wrap:anywhere}
.rt small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.when.soon{color:var(--warn)}
.when.now{color:var(--crit)}
.ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 13%,var(--surface));color:var(--ac)}
.ti svg{width:19px;height:19px}
.row.crit .ti{background:var(--crit-soft);color:var(--crit)}
.row.warn .ti{background:var(--warn-soft);color:var(--warn)}
.empty{padding:16px;color:var(--muted);font-size:14.5px;text-align:center}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:200;max-width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}
/* Würfel auf dem Sperrbildschirm: Deckel klappt auf, drei Bereiche springen heraus */
.cube{width:96px;height:96px;margin:0 auto 4px;perspective:420px}
.cube svg{width:100%;height:100%;overflow:visible;display:block}
.cube .flap,.cube .inner,.cube .pop{opacity:0}
.cube .flap{transform-box:view-box}
.cube .fl{transform-origin:122px 180px}.cube .fr{transform-origin:256px 104px}
.cube .pop{transform-box:fill-box;transform-origin:center}
.cube.open .flap,.cube.open .inner{opacity:1}
.cube.open .glow{animation:mbGlow .7s ease-out .12s both}
.cube.open .fl{animation:mbFlL .5s cubic-bezier(.35,1.15,.5,1) forwards}
.cube.open .fr{animation:mbFlR .5s cubic-bezier(.35,1.15,.5,1) .05s forwards}

.cube.open .p1{animation-delay:.2s;--tx:-175px;--rz:-14deg}.cube.open .p2{animation-delay:.27s;--tx:0px;--rz:0deg}.cube.open .p3{animation-delay:.34s;--tx:175px;--rz:14deg}

svg.ln{width:100%;height:auto;display:block;overflow:visible}
.ln .gl{stroke:var(--line);stroke-width:1}.ln .ax{fill:var(--muted);font-size:10px}
.ln .l1,.ln .l2{fill:none;stroke:var(--c-gesund);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ln .l2{stroke-dasharray:5 4}
.ln .dt1,.ln .dt2{fill:var(--c-gesund);stroke:var(--surface);stroke-width:2}.ln .lv{fill:var(--ink);font-size:11px;font-weight:700}

.cal>b{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cd{min-height:40px;border-radius:9px;background:var(--sunk);display:grid;align-content:start;justify-items:center;gap:2px;padding:4px 2px;font-size:12px;font-weight:600;color:var(--ink);cursor:default}
.cd.out{opacity:.38}.cd.now{outline:2px solid var(--accent);outline-offset:-2px}.cd.has{cursor:pointer;background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.cd i{display:flex;gap:2px;justify-content:center;min-height:9px}

<script>
'use strict';
const APP_VERSION='0.3.0';
/* ---------- Bereiche ---------- */
const AREAS=[
  {id:'smart',name:'Haus',app:'MySmartBox',path:'smart/',img:'boxen/smartbox.png',dir:'smartbox',host:'jazm-smartbox.github.io',def:{owner:'jazm-smartbox',repo:'smartbox-daten'}},
  {id:'gesund',name:'Gesundheit',app:'MyGesundBox',path:'gesund/',img:'boxen/gesundbox.png',dir:'gesundbox',host:'jazm-gesundbox.github.io',def:{owner:'jazm-gesundbox',repo:'gesundbox-daten'}},
  {id:'beleg',name:'Belege',app:'MyBelegBox',path:'beleg/',img:'boxen/belegbox.png',dir:'belegbox',host:'jazm-belegbox.github.io',def:{owner:'jazm-belegbox',repo:'belegbox-daten'}}];
const AR=id=>AREAS.find(a=>a.id===id);
/* ---------- Kleine Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch{}};
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch{return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch{}};
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoD(new Date());
const pD=s=>{const p=String(s).slice(0,10).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const dUntil=s=>Math.round((pD(s)-pD(today()))/864e5);
const relDay=n=>n===0?'heute':n===1?'morgen':n===2?'übermorgen':n>0?'in '+n+' Tagen':n===-1?'gestern':'vor '+(-n)+' Tagen';
const fmtD=s=>pD(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const motion=()=>!matchMedia('(prefers-reduced-motion: reduce)').matches;
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3400)}
const SVG=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={chev:SVG('<path d="M9 6l6 6-6 6"/>'),lock:SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),down:SVG('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  move:SVG('<path d="M3 7h13l-3-3M21 17H8l3 3"/>'),bell:SVG('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/>'),cal:SVG('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  pkg:SVG('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'),sun:SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  shield:SVG('<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/>'),warn:SVG('<path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'),
  check:SVG('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>'),todo:SVG('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>')};

/* ---------- Verschlüsselung: Schlüssel aus dem Passwort (PBKDF2, 310 000 Runden), AES-256-GCM ---------- */
const te=new TextEncoder(),td=new TextDecoder(),rnd=n=>crypto.getRandomValues(new Uint8Array(n)),ITER=310000;
const b64=buf=>{const u=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function derive(pw,salt){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(obj,k,salt){const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(obj)));return{v:1,iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct),saved:Date.now()}}
async function unseal(p,k){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p.iv)},k,unb64(p.ct))))}
/* Tresor von MyBox selbst: nur Einstellungen (Sicherung, Update, Erinnerungen) – die Daten liegen in den Bereichen */
const VKEY='mybox_vault',BKEY='mybox_bio';
const idb=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('mybox',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv',mode);const rq=fn(t.objectStore('kv'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)}));
  return{get:k=>tx('readonly',s=>s.get(k)),put:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k))}})();
let vaultJson=null,KEY=null,SALT=null,PW=null,CFG=null;
const vaultOk=j=>{try{const v=JSON.parse(j);return !!(v&&v.salt&&v.iv&&v.ct)}catch{return false}};
async function loadVault(){const a=lsGet(VKEY);let b=null;try{b=await idb.get('vault')}catch{}
  const ok=a&&vaultOk(a),bOk=typeof b==='string'&&vaultOk(b);
  vaultJson=bOk&&(!ok||JSON.parse(b).saved>=JSON.parse(a).saved)?b:ok?a:null}
async function writeVault(json){let ok=false;try{await idb.put('vault',json);ok=true}catch{}if(lsSet(VKEY,json))ok=true;if(!ok)throw new Error('store');vaultJson=json}
let saving=Promise.resolve();
function saveCfg(){if(!KEY||!CFG)return saving;const k=KEY,s=SALT,c=JSON.parse(JSON.stringify(CFG));
  saving=saving.then(async()=>writeVault(JSON.stringify(await seal(c,k,s)))).catch(()=>toast('Speichern fehlgeschlagen.'));return saving}
const defCfg=()=>({v:1,gh:null,upd:null,remind:{on:false,lead:14,bg:false},created:today()});

/* ---------- Fingerabdruck: Passkey mit PRF (Google Passwortmanager), schützt das MyBox-Passwort ---------- */
const bioSupported=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
async function keyFromPrf(r,prfSalt){const base=await crypto.subtle.importKey('raw',r,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:prfSalt,info:te.encode('mybox-bio-v1')},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function prfKey(credId,prfSalt){
  const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:credId}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:prfSalt}}}}});
  const r=a.getClientExtensionResults()?.prf?.results?.first;if(!r)throw new Error('noprf');return keyFromPrf(r,prfSalt)}
async function enableBio(pw){
  const prfSalt=rnd(32);
  const cred=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'MyBox',id:location.hostname},user:{id:rnd(16),name:'MyBox',displayName:'MyBox'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{residentKey:'required',requireResidentKey:true,userVerification:'required'},timeout:60000,extensions:{prf:{eval:{first:prfSalt}}}}});
  const credId=new Uint8Array(cred.rawId),ext=cred.getClientExtensionResults()?.prf;
  if(ext&&ext.enabled===false)throw new Error('noprf');
  let k;if(ext?.results?.first)k=await keyFromPrf(ext.results.first,prfSalt);else{toast('Jetzt zur Bestätigung den Passkey „MyBox“ wählen …');k=await prfKey(credId,prfSalt)}
  const iv=rnd(12),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(pw));
  lsSet(BKEY,JSON.stringify({cred:b64(credId),salt:b64(prfSalt),iv:b64(iv),ct:b64(ct)}));
}
async function bioGetPassword(){const b=JSON.parse(lsGet(BKEY));const k=await prfKey(unb64(b.cred),unb64(b.salt));
  try{return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(b.iv)},k,unb64(b.ct)))}catch{throw new Error('nopw')}}

/* ---------- Sperrbildschirm ---------- */
let UNLOCKED=false,bioBusy=false;
function showLock(auto){
  const has=!!vaultJson;
  $('#app').hidden=true;$('#areas').innerHTML='';$('#areas').classList.add('off');closeSheet(true);try{$('#dlg').open&&$('#dlg').close()}catch{}
  $('#lock').hidden=false;$('#lver').textContent='Version '+APP_VERSION;
  $('#pw2').hidden=has;$('#pw2').required=!has;$('#pw').value='';$('#pw2').value='';$('#lockErr').textContent='';
  $('#pw').autocomplete=has?'current-password':'new-password';
  $('#lockGo').textContent=has?'Entsperren':'MyBox anlegen';
  $('#lockHint').textContent=has?'Haus, Gesundheit und Belege – verschlüsselt auf diesem Gerät.':'Lege ein Passwort fest (mind. 10 Zeichen). Es gilt für alle drei Bereiche. Ohne Passwort sind die Daten nicht wiederherstellbar.';
  $('#lockMore').textContent=has?'':'Du ziehst aus MySmartBox, MyGesundBox und MyBelegBox um? Leg zuerst ein Passwort fest. Danach übernimmst du die Daten unter Daten & Sicherheit → Umzug.';
  $('#bioBtn').hidden=!(has&&lsGet(BKEY)&&bioSupported());
  if($('#bioBtn').hidden)setTimeout(()=>$('#pw').focus(),60);else if(auto)setTimeout(tryBio,350);
}
async function unlockWith(pw){
  const p=JSON.parse(vaultJson),salt=unb64(p.salt),k=await derive(pw,salt),c=await unseal(p,k);
  KEY=k;SALT=salt;PW=pw;CFG=Object.assign(defCfg(),c);UNLOCKED=true;lastAct=Date.now();
  cubeOpen(()=>{if(!UNLOCKED)return;$('#lock').hidden=true;$('#app').hidden=false;renderDash();
    try{$('#app').animate([{opacity:0,transform:'scale(.97)'},{opacity:1,transform:'none'}],{duration:360,easing:'cubic-bezier(.2,.85,.25,1)'})}catch{}});
  try{navigator.storage?.persist?.()}catch{}
  startAreas();
}
$('#lockForm').onsubmit=async e=>{e.preventDefault();
  const pw=$('#pw').value,btn=$('#lockGo'),has=!!vaultJson;$('#lockErr').textContent='';
  if(!window.crypto?.subtle){$('#lockErr').textContent='Diese App braucht HTTPS und einen aktuellen Browser.';return}
  if(!has){if(pw.length<10){$('#lockErr').textContent='Das Passwort braucht mindestens 10 Zeichen.';return}
    if(pw!==$('#pw2').value){$('#lockErr').textContent='Die Passwörter stimmen nicht überein.';return}}
  btn.disabled=true;btn.textContent='Bitte warten …';
  try{if(!has){SALT=rnd(16);KEY=await derive(pw,SALT);CFG=defCfg();await writeVault(JSON.stringify(await seal(CFG,KEY,SALT)))}
    await unlockWith(pw)}
  catch(err){KEY=null;$('#lockErr').textContent=has?'Das Passwort ist falsch.':'Fehler: '+err.message;buzz([30,50,30])}
  finally{btn.disabled=false;btn.textContent=vaultJson?'Entsperren':'MyBox anlegen'}};
async function tryBio(){if(bioBusy||UNLOCKED||$('#bioBtn').hidden||document.hidden)return;bioBusy=true;const b=$('#bioBtn');b.disabled=true;$('#lockErr').textContent='';
  try{await unlockWith(await bioGetPassword())}
  catch(err){KEY=null;$('#lockErr').textContent=err.message==='nopw'?'Der Fingerabdruck passt nicht mehr zum Passwort. Bitte mit Passwort entsperren und neu einrichten.':err.name==='NotAllowedError'?'Abgebrochen. Du kannst auch das Passwort nutzen.':'Fingerabdruck hat nicht geklappt. Bitte das Passwort nutzen.'}
  finally{b.disabled=false;bioBusy=false}}
$('#bioBtn').onclick=tryBio;

async function lockAll(){

  await Promise.race([Promise.all(Object.values(API).map(a=>Promise.resolve().then(()=>a.flush()).catch(()=>{}))),sleep(1500)]);

};

function syncArea(app){const api=API[app];if(!api)return;

    if(want&&(!i.on||!sameGh(api,want)))api.bkSet(want)}catch(e){}

function sameGh(api,g){try{const c=api.ghCur();
  return !!c&&c.owner===g.owner&&c.repo===g.repo&&c.token===g.token&&(c.dir||'')===(g.dir||'')}catch(e){return false}}
function openArea(id){if(!UNLOCKED)return;if(curArea==='gesund'&&id!=='gesund')gLeft=Date.now();closeSheet(true);const box=$('#areas');try{API[id]&&API[id].refresh&&API[id].refresh()}catch(e){}

  if(history.state?.mbx==='area'){ignorePop=true;history.back()}renderDash()}
function updLoad(){const el=$('#aload');if(!el)return;const id=curArea;if(!id||API[id]){el.hidden=true;return}

    :`<img src="${a.img}" alt=""><span>${esc(a.name)} wird entschlüsselt …</span><button type="button" class="ds-btn" id="aHome">Zur Übersicht</button>`;

    OLDQ.delete(id);oldOpen=false;DS.yay('Übernommen');toast(a.name+' ist jetzt mit deinem MyBox-Passwort verschlüsselt.');setTimeout(nextOld,400)},
    {ok:'Übernehmen',html:`<p class="ds-dlg-intro">Die Daten im Bereich <b>${esc(a.name)}</b> sind mit einem anderen Passwort verschlüsselt – zum Beispiel mit dem bisherigen Passwort der ${esc(a.app)} oder dem Passwort, das beim Sichern galt. Gib es einmal ein. Danach gilt dein MyBox-Passwort.</p>`,
     onCancel:()=>{oldOpen=false}})}

/* ---------- Dashboard ---------- */
function schedDash(ms){clearTimeout(dashT);dashT=setTimeout(()=>{if(UNLOCKED){renderDash();writeSched()}},ms||0)}
const safe=(f,d)=>{try{return f()}catch(e){console.warn(e);return d}};
function bkAll(){const ls=AREAS.map(a=>API[a.id]&&safe(()=>API[a.id].bkInfo(),null)).filter(Boolean);
  const own=ls.filter(x=>x.own);
  return{ghErr:(ls.find(x=>x.ghErr)||{}).ghErr||'',ghOk:own.length>0&&own.every(x=>x.ghOk),own:own.length>0,
    days:own.some(x=>x.days==null)?null:Math.max(0,...own.map(x=>x.days)),dirty:own.reduce((s,x)=>s+(x.dirty||0),0)}}
/* ---------- Gesundheit zusätzlich schützen (Fingerabdruck bzw. Passwort) ---------- */
let gAuth=false,gLeft=0;

async function askGesund(){
  if(lsGet(BKEY)&&bioSupported()){try{const p=await bioGetPassword();if(p===PW){gAuth=true;gLeft=Date.now();return true}}catch(e){if(e&&e.name==='NotAllowedError'){toast('Abgebrochen.');return false}}}
  return new Promise(res=>{let done=false;form('Gesundheit entsperren',[{k:'pw',l:'Dein MyBox-Passwort',t:'password',req:true}],async(v,fail)=>{if(v.pw!==PW)return fail('Das Passwort ist falsch.');gAuth=true;gLeft=Date.now();done=true;res(true)},
    {ok:'Entsperren',html:'<p class="ds-dlg-intro">Der Bereich Gesundheit ist zusätzlich geschützt.</p>',onCancel:()=>{if(!done)res(false)}})})}

/* ---------- Diagramme ---------- */
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const SHAPE={smart:'<circle cx="5" cy="5" r="4.2"/>',gesund:'<rect x="1" y="1" width="8" height="8" rx="1.5"/>',beleg:'<path d="M5 .3L9.7 5 5 9.7.3 5z"/>'};
const shp=(app,s)=>`<svg class="shp" width="${s||10}" height="${s||10}" viewBox="0 0 10 10" style="color:var(--c-${app})" aria-hidden="true"><g fill="currentColor">${SHAPE[app]}</g></svg>`;
const fmtE=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
function calGrid(tl){const t0=pD(today()),start=new Date(t0);start.setDate(start.getDate()-((start.getDay()+6)%7));
  const by={};for(const x of tl)(by[x.d]=by[x.d]||[]).push(x);const cells=[];
  for(let i=0;i<35;i++){const d=new Date(start);d.setDate(d.getDate()+i);const k=isoD(d),n=dUntil(k),ev=by[k]||[];
    const tip=ev.length?`${d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}\n`+ev.map(x=>'· '+x.title+(x.time?' '+x.time:'')).join('\n'):'';
    cells.push(`<div class="cd${n<0||n>30?' out':''}${n===0?' now':''}${ev.length?' has':''}"${tip?` data-tip="${esc(tip)}" tabindex="0"`:''}><span>${d.getDate()===1?d.getDate()+'.'+(d.getMonth()+1)+'.':d.getDate()}</span><i>${ev.slice(0,3).map(x=>shp(x.app,8)).join('')}</i></div>`)}
  return `<div class="cal">${WD.map(w=>`<b>${w}</b>`).join('')}${cells.join('')}</div><div class="lgd">${AREAS.map(a=>`<span>${shp(a.id)}${esc(a.name)}</span>`).join('')}</div>`}
function bars(rows,col,fmt,max){max=max||Math.max(1,...rows.map(r=>r[1]));
  return `<div class="hb">${rows.map(([l,v,c,tip])=>`<div class="hbr" data-tip="${esc(tip||l+': '+fmt(v))}"><span class="hbl">${esc(l)}</span><span class="hbt"><i style="width:${Math.max(v>0?2:0,v/max*100)}%;background:${c||col}"></i></span><span class="hbv">${esc(fmt(v))}</span></div>`).join('')}</div>`}
function stack(parts){const tot=parts.reduce((s,p)=>s+p.n,0)||1;
  return `<div class="stk">${parts.filter(p=>p.n).map(p=>`<i style="flex:${p.n};background:${p.c}" data-tip="${esc(p.l+': '+p.n)}"></i>`).join('')}</div><div class="lgd">${parts.map(p=>`<span><em style="background:${p.c}"></em>${esc(p.l)} <b>${p.n}</b></span>`).join('')}</div>`}
function bpLine(pts,Z){const W=320,H=150,L=30,R=34,T=10,B=22;
  const vals=pts.flatMap(p=>[p.v1,p.v2]).concat(Z.v1?Z.v1:[],Z.v2?Z.v2:[]);let lo=Math.floor((Math.min(...vals)-5)/10)*10,hi=Math.ceil((Math.max(...vals)+5)/10)*10;if(hi-lo<30)hi=lo+30;
  const x=i=>L+(pts.length<2?0:i*(W-L-R)/(pts.length-1)),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[];for(let v=lo;v<=hi;v+=(hi-lo)>60?20:10)ticks.push(v);
  const path=k=>pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1)).join('');
  const band=(r)=>r?`<rect x="${L}" y="${y(r[1])}" width="${W-L-R}" height="${Math.max(0,y(r[0])-y(r[1]))}" fill="var(--c-gesund)" opacity=".08"/>`:'';
  const last=pts[pts.length-1],fd=s=>{const d=new Date(s);return isNaN(d)?'':d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})};
  const step=pts.length>1?(W-L-R)/(pts.length-1):W-L-R;
  return `<svg class="ln" viewBox="0 0 ${W} ${H}" role="img" aria-label="Blutdruck, letzte ${pts.length} Messungen">
    ${band(Z.v1)}${band(Z.v2)}
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-6}" y="${y(v)+4}" class="ax" text-anchor="end">${v}</text>`).join('')}
    <text x="${L}" y="${H-6}" class="ax">${esc(fd(pts[0].d))}</text><text x="${W-R}" y="${H-6}" class="ax" text-anchor="end">${esc(fd(last.d))}</text>
    <path d="${path('v1')}" class="l1"/><path d="${path('v2')}" class="l2"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last.v1)}" r="4.5" class="dt1"/><circle cx="${x(pts.length-1)}" cy="${y(last.v2)}" r="4.5" class="dt2"/>
    <text x="${x(pts.length-1)+8}" y="${y(last.v1)+4}" class="lv">${Math.round(last.v1)}</text><text x="${x(pts.length-1)+8}" y="${y(last.v2)+4}" class="lv">${Math.round(last.v2)}</text>
    ${pts.map((p,i)=>`<rect x="${x(i)-step/2}" y="0" width="${Math.max(step,8)}" height="${H}" fill="transparent" data-tip="${esc(fd(p.d)+': '+Math.round(p.v1)+'/'+Math.round(p.v2)+' mmHg')}"/>`).join('')}
  </svg><div class="lgd"><span><em class="ls"></em>systolisch</span><span><em class="ls dash"></em>diastolisch</span>${Z.v1||Z.v2?'<span><em class="band"></em>Zielbereich</span>':''}</div>`}
function chartCard(app,title,sub,body){return `<div class="chart" style="--ac:var(--c-${app})"><button type="button" class="chd" data-go="${app}">${shp(app,12)}<span><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</span><span class="chev">${I.chev}</span></button>${body}</div>`}
function chartsHtml(){const out=[],S=a=>API[a]&&API[a].stats?safe(()=>API[a].stats(),null):null;
  const b=S('beleg'),g=gOK()?S('gesund'):null,s=S('smart');

  if(b&&b.devices)out.push(chartCard('beleg','Garantie-Ampel',b.devices===1?'1 Gerät':b.devices+' Geräte',stack([{l:'geschützt',n:b.garantie.ok,c:'var(--ok)'},{l:'endet in 90 Tagen',n:b.garantie.bald,c:'var(--warn)'},{l:'abgelaufen',n:b.garantie.ab,c:'var(--muted)'}])));
  if(g&&g.bp.length>=2)out.push(chartCard('gesund','Blutdruck',`letzte ${g.bp.length} Messungen`,bpLine(g.bp,g.ziel)));
  if(g&&g.medis.length)out.push(chartCard('gesund','Medikamente','so lange reicht der Vorrat',bars(g.medis.slice(0,6).map(m=>[m.name,m.reicht,m.reicht<=Math.min(3,m.vorlauf)?'var(--crit)':m.reicht<=m.vorlauf?'var(--warn)':'var(--ok)',m.name+': noch '+m.reicht+' Tage, bis '+fmtD(m.leer)]),'',v=>v+(v===1?' Tag':' Tage'),Math.max(30,...g.medis.map(m=>m.reicht)))));
  if(CFG.gLock&&!gOK()&&API.gesund)out.push(`<button type="button" class="chart lockd" data-go="gesund">${shp('gesund',12)}<span><b>Gesundheit ist geschützt</b><small>Zum Anzeigen entsperren</small></span>${I.lock}</button>`);
  if(s&&s.rooms.length)out.push(chartCard('smart','Geräte nach Raum',s.rooms.reduce((x,r)=>x+r[1],0)+' Geräte',bars(s.rooms.slice(0,6),'var(--c-smart)',v=>String(v))));
  return out.length?`<div class="sec">Überblick</div><div class="charts">${out.join('')}</div>`:''}

/* ---------- Erinnerungen über alle Bereiche (Service Worker zeigt sie an, auch bei geschlossener App) ---------- */
const SCHED='sched-mybox',LEADS=[7,14,30];let lastSched='',SCH={};
const RML={'b.k':'Kündigungsfrist','b.g':'Garantie-Ende','b.p':'Preisänderung','g.t':'Arzttermin','g.v':'Vorsorge','g.u':'Ablauf eines Dokuments','g.w':'Kontaktlinsen-Wechsel','g.n':'Kontaktlinsen nachbestellen'};
function schedAll(){const L=(CFG.remind&&CFG.remind.lead)||14;
  for(const a of AREAS){const api=API[a.id];if(api)SCH[a.id]=safe(()=>api.sched(L),[]).map(x=>({d:x.d,t:a.id[0]+'.'+x.t,l:+x.l||L}))}
  return Object.values(SCH).flat().filter(x=>x.d>=today()).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)}
async function writeSched(force){
  if(!CFG||!('caches' in window))return;
  try{const c=await caches.open(SCHED);
    if(!CFG.remind||!CFG.remind.on){if(lastSched!=='off'){lastSched='off';await c.delete('./__sched');try{navigator.clearAppBadge&&navigator.clearAppBadge()}catch{}}return}
    const items=schedAll(),body=JSON.stringify({items});
    try{const n=items.filter(x=>dUntil(x.d)<=x.l).length;if(navigator.setAppBadge)n?navigator.setAppBadge(n):navigator.clearAppBadge()}catch{}
    if(body!==lastSched||force){lastSched=body;await c.put('./__sched',new Response(body,{headers:{'content-type':'application/json'}}))}
    if(force){const r=await navigator.serviceWorker.ready;r.active&&r.active.postMessage({type:'REMIND',force:true})}
  }catch{}}
async function bgSync(reg){try{if(reg.periodicSync){await reg.periodicSync.register('mybox-erinnerung',{minInterval:12*3600e3});return true}}catch{}return false}
async function remindOn(){
  if(!('Notification' in window)||!('serviceWorker' in navigator))throw new Error('Dieser Browser kann keine Benachrichtigungen anzeigen.');
  const p=await Notification.requestPermission();
  if(p!=='granted')throw new Error('Benachrichtigungen sind blockiert. Erlaube sie in den Android-Einstellungen unter Apps → MyBox (oder Chrome) → Benachrichtigungen.');
  const bg=await bgSync(await navigator.serviceWorker.ready);
  CFG.remind={...CFG.remind,on:true,bg};await saveCfg();await writeSched(true);
  toast(bg?'Erinnerungen sind an – auch bei geschlossener App.':'Erinnerungen sind an. Geprüft wird beim Öffnen der App.')}
async function remindOff(){CFG.remind={...CFG.remind,on:false};await saveCfg();
  try{const r=await navigator.serviceWorker.ready;if(r.periodicSync)await r.periodicSync.unregister('mybox-erinnerung');(await r.getNotifications({tag:'mybox-erinnerung'})).forEach(n=>n.close())}catch{}
  await writeSched()}
function remindNext(){const it=schedAll();if(!it.length)return 'Gerade steht nichts an.';const td=today();
  const st=x=>{const d=pD(x.d);d.setDate(d.getDate()-x.l);const s=isoD(d);return s<td?td:s};
  const f=it.slice().sort((a,b)=>st(a)<st(b)?-1:st(a)>st(b)?1:0)[0],n=dUntil(f.d),ar=AREAS.find(a=>a.id[0]===f.t[0]);
  return st(f)===td?`<b>Als Nächstes:</b> ${RML[f.t]||'Frist'} (${esc(ar.name)}) am ${fmtD(f.d)} – ${relDay(n)}. Die Meldung kommt beim Öffnen der App, auch noch gesperrt.`
    :`<b>Als Nächstes:</b> ${RML[f.t]||'Frist'} (${esc(ar.name)}) am ${fmtD(f.d)}. Die Meldung kommt ab dem ${fmtD(st(f))}.`}
function remindHtml(){
  if(!('Notification' in window&&'serviceWorker' in navigator))return '<p class="ds-hint">Dieser Browser kann keine Benachrichtigungen anzeigen.</p>';
  const R=CFG.remind||{};
  if(!R.on)return `<p class="ds-hint">MyBox meldet sich vor <b>Arztterminen</b>, fälligen <b>Vorsorgen</b>, ablaufenden <b>Überweisungen</b>, beim <b>Kontaktlinsen-Wechsel</b>, vor <b>Kündigungsfristen</b>, <b>Garantie-Enden</b> und <b>Preisänderungen</b> – auch bei geschlossener App. Dafür liegen nur die <b>Daten ohne Namen, Ärzte oder Beträge</b> unverschlüsselt auf dem Handy.</p>
    <div class="ds-acts"><button type="button" class="ds-btn pri" data-m="rm-on">Einschalten</button></div>`;
  const P=Notification.permission;
  return `<p class="ds-hint">An. MyBox meldet sich einmal am Tag mit einer neutralen Benachrichtigung. Geprüft wird bei jedem Öffnen der App${R.bg?' und ab und zu bei geschlossener App – wie oft, entscheidet Android':'. Bei geschlossener App nur, wenn sie auf dem Startbildschirm installiert ist'}. Ganz sicher: zusätzlich in den Kalender exportieren.</p>
    <div class="ds-lbl">So früh melden</div><div class="ds-seg" role="radiogroup" aria-label="So früh melden" style="margin:0 0 6px">${LEADS.map(k=>`<button type="button" role="radio" aria-checked="${(R.lead||14)===k}" data-m="rm-lead" data-v="${k}">${k} Tage</button>`).join('')}</div>
    <p class="ds-hint" style="font-size:13px">Gilt für Fristen, Vorsorge, Dokumente und Linsen-Vorrat. Arzttermine und Linsen-Wechsel kommen immer am Vortag und am Tag selbst.</p>
    ${P!=='granted'?`<div class="ds-box crit"><b>Benachrichtigungen sind ${P==='default'?'nicht erlaubt':'blockiert'}.</b> Darum kommt keine Meldung. ${P==='default'?'Tippe auf „Erlauben“.':'Erlaube sie in den Android-Einstellungen: Apps → MyBox (oder Chrome) → Benachrichtigungen → an. Falls dort alles an ist: in Chrome auf das Symbol neben der Adresse → Berechtigungen → Benachrichtigungen → zulassen.'}<div class="ds-acts"><button type="button" class="ds-btn" data-m="rm-perm">${P==='default'?'Erlauben':'Erneut prüfen'}</button></div></div>`:''}
    <p class="ds-stat" style="display:block">${remindNext()}</p>
    <div class="ds-acts"><button type="button" class="ds-btn" data-m="rm-test">Test-Benachrichtigung</button><button type="button" class="ds-btn" data-m="rm-off">Ausschalten</button></div>`}

function setUpd(html){UPD=html;const el=$('#updStatus');if(el){el.innerHTML=html;el.hidden=!html}}
async function gh(path,opt={},tok){
  const r=await fetch('https://api.github.com'+path,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+tok,'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===404&&opt.allow404)return null;const j=await r.json().catch(()=>({}));

function updSetup(){form('App-Update verbinden',[{k:'repo',l:'Repo (Besitzer/Name)',req:true,v:CFG.upd?.repo||defaultRepo()},{k:'token',l:'Zugangsschlüssel (github_pat_…)',t:'password',req:true}],async(v,fail)=>{

  {ok:'Prüfen & verbinden',html:'<p class="ds-dlg-intro">Dafür brauchst du einen eigenen Fine-grained-Zugangsschlüssel nur für das App-Repo mit den Rechten <b>Contents: Read and write</b> und <b>Actions: Read</b>. Der Schlüssel der Datensicherung reicht dafür nicht.</p>'})}
async function updUpload(){
  const file=await pickFile('.zip,application/zip');if(!file)return;if(!/\.zip$/i.test(file.name)){toast('Bitte eine .zip-Datei wählen.');return}
  const name=file.name.replace(/[^\w.\-]/g,'_'),repo=CFG.upd.repo,tok=CFG.upd.token;
  if(!confirm(`„${name}“ (${Math.round(file.size/1024)} KB) ins Repo hochladen und veröffentlichen?`))return;
  setUpd('⏳ Lade Zip hoch …');
  try{const old=await gh(`/repos/${repo}/contents/${encodeURIComponent(name)}`,{allow404:true},tok);
    const res=await gh(`/repos/${repo}/contents/${encodeURIComponent(name)}`,{method:'PUT',body:JSON.stringify({message:'Paket '+name+' (aus MyBox)',content:b64(await file.arrayBuffer()),branch:'main',...(old?.sha?{sha:old.sha}:{})})},tok);
    setUpd('⚙️ Hochgeladen – GitHub entpackt und prüft das Paket …');watchRun(repo,tok,res.commit.sha)}
  catch(e){setUpd('❌ '+esc(e.message))}}
async function watchRun(repo,tok,sha){
  const t0=Date.now();let run=null;
  while(Date.now()-t0<5*60e3){await sleep(5000);try{const j=await gh(`/repos/${repo}/actions/runs?head_sha=${sha}&per_page=5`,{},tok);run=j.workflow_runs?.[0]||run}catch(e){}if(run&&run.status==='completed')break}
  if(!run){setUpd('⚠️ Kein Ablauf gefunden. Ist <b>.github/workflows/paket.yml</b> im Repo angelegt?');return}
  const link=/^https:\/\//.test(run.html_url||'')?` <a href="${esc(run.html_url)}" target="_blank" rel="noopener noreferrer">Details</a>`:'';
  if(run.status!=='completed'){setUpd('⏳ Ablauf läuft noch länger als üblich.'+link);return}
  if(run.conclusion!=='success'){let msg='';try{const jobs=await gh(`/repos/${repo}/actions/runs/${run.id}/jobs`,{},tok);const id=jobs.jobs?.[0]?.id;
      if(id){const ann=await gh(`/repos/${repo}/check-runs/${id}/annotations`,{},tok);msg=(ann.find(a=>a.annotation_level==='failure')||ann[0])?.message||''}}catch(e){}
    setUpd('❌ Paket abgelehnt'+(msg?': '+esc(msg.replace(/^MyBox:?/,'')):'.')+link);return}
  setUpd('✅ Paket übernommen – warte auf die Veröffentlichung …'+link);
  const t1=Date.now();
  while(Date.now()-t1<4*60e3){await sleep(10000);
    try{const html=await (await fetch('./index.html?v='+Date.now(),{cache:'no-store'})).text();const v=(html.match(/APP_VERSION='([\d.]+)'/)||[])[1];

  setUpd('✅ Paket übernommen. Die Seite ist noch nicht aktualisiert – später neu laden.'+link)}

  else if(!$('#lock').hidden)setTimeout(tryBio,300)});
setInterval(()=>{if(UNLOCKED&&!curArea&&!document.hidden&&!sheetOpen())schedDash(0)},60000);
/* Zurück-Geste: Blatt schließen bzw. zurück zur Übersicht */
let ignorePop=false;
addEventListener('popstate',()=>{if(ignorePop){ignorePop=false;return}
  if($('#dlg').open){$('#dlg').close();return}
  if(sheetOpen()){closeSheet(true);return}
  if(curArea){curArea=null;$('#areas').classList.add('off');for(const f of Object.values(FR))f.classList.remove('on');renderDash()}});

/* ---------- Service Worker: offline nutzbar, Erinnerungen, neue Version ---------- */
let swReg=null;
function showUpdBar(){if(document.getElementById('dsupd'))return;const b=document.createElement('div');b.id='dsupd';b.className='ds-updbar';b.setAttribute('role','status');
  b.innerHTML='<span>Neue Version von MyBox ist da.</span><button type="button" class="ds-btn pri">Aktualisieren</button><button type="button" class="ds-x" aria-label="Später">✕</button>';
  b.querySelector('.ds-btn').onclick=async()=>{b.querySelector('.ds-btn').disabled=true;for(const a of Object.values(API))try{await a.flush()}catch{}location.reload()};
  b.querySelector('.ds-x').onclick=()=>b.remove();document.body.appendChild(b)}
if('serviceWorker' in navigator){const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{swReg=r}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl)showUpdBar()})}

/* ---------- Vorschläge am App-Symbol: ?go=bereich.aktion ---------- */
let GO=(()=>{try{const u=new URL(location.href),g=u.searchParams.get('go');if(g){u.searchParams.delete('go');history.replaceState(null,'',u.pathname+u.search+u.hash)}return /^[a-z]+(\.[a-z]+)?$/.test(g||'')?g:null}catch{return null}})();
async function runGo(){if(!GO||!UNLOCKED||$('#app').hidden&&!$('#lock').hidden)return;const [app,k]=GO.split('.');
  if(app==='suche'){GO=null;setTimeout(()=>openSheet('search'),400);return}
  const api=API[app];if(!api||!api.shortcut)return;GO=null;
  if(!await openAreaG(app))return;setTimeout(()=>{try{api.shortcut(k)}catch(e){}},300)}
/* ---------- Start ---------- */
loadVault().then(()=>showLock(true));
</script>
